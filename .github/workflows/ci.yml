name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        sanitize: [OFF, ON]
    name: ${{ matrix.compiler }} sanitize=${{ matrix.sanitize }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DROUTEGUARD_SANITIZE=${{ matrix.sanitize }}
          -DROUTEGUARD_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build fuzzer
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
          -DROUTEGUARD_FUZZ=ON -DROUTEGUARD_BUILD_TESTS=OFF -DROUTEGUARD_BUILD_BENCH=OFF
          && cmake --build build --target fuzz_mrt
      - name: Fuzz the MRT decoder for 2 minutes
        run: ./build/fuzz_mrt -max_total_time=120 -print_final_stats=1

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image (also runs the tests)
        run: docker build -t routeguard .
      - name: Run sample
        run: docker run --rm routeguard
